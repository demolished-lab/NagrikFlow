name: civic-ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt pytest httpx fakeredis ruff==0.16.9
      - run: ruff check backend/app backend/tests
      - run: python -m pytest backend/tests/ -q
        env: { ALLOW_DEV_SECRET: "1" }
  backend-pg:
    # Full suite against real PostgreSQL (migrations, pg_trgm indexes, pg_dump backups)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civic_test
          POSTGRES_USER: civic
          POSTGRES_PASSWORD: civic
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ALLOW_DEV_SECRET: "1"
      DATABASE_URL: postgresql+psycopg://civic:civic@localhost:5432/civic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: pip install -r backend/requirements.txt pytest httpx fakeredis
      - run: python -m pytest backend/tests/ -q
  image:
    # Build the backend container and smoke-test it (Dockerfile changes,
    # postgresql-client install, startup migrations, /healthz + /readyz).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t civic-backend:${{ github.sha }} backend
      - name: Smoke test /healthz and /readyz
        run: |
          docker run -d --name civic -p 8000:8000 \
            -e ALLOW_DEV_SECRET=1 -e DATABASE_URL=sqlite:///./civic.db \
            civic-backend:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              echo " healthy after ${i} tries"
              curl -fsS http://localhost:8000/readyz
              exit 0
            fi
            sleep 2
          done
          echo "::error::/healthz never became healthy"
          docker logs civic
          exit 1
      - if: always()
        run: docker rm -f civic || true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --prefix frontend --no-audit --no-fund
      # supply-chain gate: moderate+ advisories fail the build (0 known now)
      - run: npm audit --prefix frontend --audit-level=moderate
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # PYSEC-2026-3740 (nltk 3.10.3) is an explicit, documented exception:
      # transitive via crawl4ai, hardcoded corpus paths only, no fixed release
      # yet (see backend/requirements.txt). Everything else must be clean.
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-3740
